name: Build BlueStacks KernelSU Next Kernel

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version tag (e.g. v4.19.195)'
        required: false
        default: 'v4.19.195'

jobs:
  build-kernel:
    name: Build Linux 4.19 x86_64 + KernelSU Next Legacy
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ── 1. Checkout this repo (contains our scripts + config) ─────────────
      - name: Checkout build repo
        uses: actions/checkout@v4

      # ── 2. Install kernel build dependencies ─────────────────────────────
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            git \
            curl \
            cpio \
            kmod \
            rsync \
            dwarves \
            zstd

      # ── 3. Clone Linux 4.19 stable kernel source ─────────────────────────
      - name: Clone Linux 4.19 stable kernel source
        run: |
          KVER="${{ github.event.inputs.kernel_version || 'v4.19.195' }}"
          echo "KVER=$KVER" >> $GITHUB_ENV
          git clone --depth=1 --branch "$KVER" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            kernel-src

      # ── 4. Apply BlueStacks-compatible defconfig ──────────────────────────
      - name: Apply kernel config
        run: |
          cd kernel-src
          cp ../config/bluestacks_pie64_defconfig .config
          make ARCH=x86_64 olddefconfig

      # ── 5. Integrate KernelSU Next legacy driver ─────────────────────────
      - name: Integrate KernelSU Next legacy
        run: |
          cd kernel-src
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy
          echo "KernelSU Next driver integrated"

      # ── 6. Enable KSU + kprobe config options ────────────────────────────
      - name: Enable KSU config options
        run: |
          cd kernel-src
          ./scripts/config --enable CONFIG_KSU
          ./scripts/config --enable CONFIG_KPROBES
          ./scripts/config --enable CONFIG_KPROBE_EVENTS
          ./scripts/config --enable CONFIG_HAVE_KPROBES
          ./scripts/config --enable CONFIG_KPROBE_EVENTS_ON_NOTRACE
          ./scripts/config --enable CONFIG_KSU_KPROBE_HOOKS
          ./scripts/config --set-val CONFIG_LOCALVERSION '"-ksu-next"'
          ./scripts/config --disable CONFIG_MODULE_SIG_FORCE
          make ARCH=x86_64 olddefconfig
          grep -E "CONFIG_KSU|CONFIG_KPROBE" .config

      # ── 7. Build bzImage with legacy patches ──────────────────────────────
      - name: Build kernel bzImage
        run: |
          cd kernel-src
          make ARCH=x86_64 prepare scripts
          bash ../scripts/patch-ksu.sh
          make ARCH=x86_64 -j$(nproc) bzImage 2>&1 | tee ../build.log
          echo "=== Build complete ==="
          ls -lh arch/x86/boot/bzImage
          file arch/x86/boot/bzImage

      # ── 8. Also build KSU module helpers (optional, if needed) ────────────
      - name: Build KSU module (if applicable)
        run: |
          cd kernel-src
          make ARCH=x86_64 -j$(nproc) modules 2>&1 | tail -20 || true

      # ── 9. Package artifacts ──────────────────────────────────────────────
      - name: Package build artifacts
        run: |
          mkdir -p artifacts
          cp kernel-src/arch/x86/boot/bzImage artifacts/bzImage-4.19-ksu-next
          cp kernel-src/.config artifacts/kernel.config
          strings artifacts/bzImage-4.19-ksu-next | grep "Linux version" | head -1 \
            > artifacts/kernel-version.txt
          cat artifacts/kernel-version.txt
          gzip -c artifacts/bzImage-4.19-ksu-next > artifacts/bzImage-4.19-ksu-next.gz
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ── 10. Upload kernel artifacts ───────────────────────────────────────
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bluestacks-ksu-next-kernel-${{ env.KVER }}
          path: |
            artifacts/bzImage-4.19-ksu-next
            artifacts/bzImage-4.19-ksu-next.gz
            artifacts/kernel.config
            artifacts/kernel-version.txt
            artifacts/SHA256SUMS.txt
          retention-days: 7

      # ── 11. Build summary ─────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## BlueStacks KernelSU Next Build Success!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel Version**: \`$(cat artifacts/kernel-version.txt)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: BlueStacks 5 Pie64 (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- **KernelSU**: Next (legacy driver)" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256**: \`$(sha256sum artifacts/bzImage-4.19-ksu-next | cut -d' ' -f1)\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact below and use \`inject-kernel.ps1\` to install." >> $GITHUB_STEP_SUMMARY
