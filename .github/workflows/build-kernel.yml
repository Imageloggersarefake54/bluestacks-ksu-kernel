name: Build BlueStacks KernelSU Next Kernel

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version tag (e.g. v4.19.195)'
        required: false
        default: 'v4.19.195'

jobs:
  build-kernel:
    name: Build Linux 4.19 x86_64 + KernelSU Next Legacy
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ── 1. Checkout this repo (contains our scripts + config) ──────────────
      - name: Checkout build repo
        uses: actions/checkout@v4

      # ── 2. Install build dependencies ─────────────────────────────────────
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libssl-dev libelf-dev \
            bc git curl python3 libncurses-dev pahole dwarves \
            gcc binutils make pkg-config

      # ── 3. Clone Linux 4.19 stable kernel ────────────────────────────────
      - name: Clone Linux 4.19 stable kernel source
        run: |
          KVER="${{ github.event.inputs.kernel_version || 'v4.19.195' }}"
          echo "Building kernel: $KVER"
          git clone --depth=1 \
            --branch "$KVER" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            kernel-src
          echo "KVER=$KVER" >> $GITHUB_ENV

      # ── 4. Apply BlueStacks-style x86 Android kernel config ──────────────
      - name: Apply kernel config
        run: |
          cd kernel-src
          # Copy our prepared config (android-x86 / BlueStacks style)
          cp ../config/bluestacks_pie64_defconfig .config
          # Resolve any new symbols with defaults
          make ARCH=x86_64 olddefconfig

      # ── 5. Integrate KernelSU Next legacy driver ──────────────────────────
      - name: Integrate KernelSU Next legacy
        run: |
          cd kernel-src
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy
          echo "KernelSU Next driver integrated"
          # Show what was actually created (path varies by branch)
          find . -maxdepth 3 -name "*.c" -path "*/KernelSU*" | head -10 || true
          find . -maxdepth 2 -name "Makefile" -newer .config | head -5 || true

      # ── 6. Enable KSU + kprobe config options ────────────────────────────
      - name: Enable KSU config options
        run: |
          cd kernel-src
          ./scripts/config --enable CONFIG_KSU
          ./scripts/config --enable CONFIG_KPROBES
          ./scripts/config --enable CONFIG_KPROBE_EVENTS
          ./scripts/config --enable CONFIG_HAVE_KPROBES
          ./scripts/config --enable CONFIG_KPROBE_EVENTS_ON_NOTRACE
          ./scripts/config --enable CONFIG_KSU_KPROBE_HOOKS
          ./scripts/config --set-val CONFIG_LOCALVERSION '"-ksu-next"'
          # Disable module signature enforcement (emulator doesn't need it)
          ./scripts/config --disable CONFIG_MODULE_SIG_FORCE
          # Re-run olddefconfig to accept all changes
          make ARCH=x86_64 olddefconfig
          # Show KSU-related config to confirm
          grep -E "CONFIG_KSU|CONFIG_KPROBE" .config

      # ── 7. Build bzImage ──────────────────────────────────────────────────
      - name: Build kernel bzImage
        run: |
          cd kernel-src
          # Prepare kernel headers and scripts
          make ARCH=x86_64 prepare scripts
          # Run genheaders if present or build selinux components
          make ARCH=x86_64 security/selinux/ || true
          # Create empty/minimal flask.h and av_permissions.h if missing (kernel 4.19 definitions)
          mkdir -p security/selinux/include security/selinux
          if [ ! -f security/selinux/include/flask.h ]; then
            echo "#ifndef _SELINUX_FLASK_H_" > security/selinux/include/flask.h
            echo "#define _SELINUX_FLASK_H_" >> security/selinux/include/flask.h
            echo "#define SECCLASS_SECURITY 1" >> security/selinux/include/flask.h
            echo "#define SECCLASS_PROCESS 2" >> security/selinux/include/flask.h
            echo "#define SECCLASS_SYSTEM 3" >> security/selinux/include/flask.h
            echo "#define SECCLASS_CAPABILITY 4" >> security/selinux/include/flask.h
            echo "#define SECCLASS_KERNEL_SERVICE 5" >> security/selinux/include/flask.h
            echo "#endif" >> security/selinux/include/flask.h
            cp security/selinux/include/flask.h security/selinux/flask.h
          fi
          if [ ! -f security/selinux/include/av_permissions.h ]; then
            echo "#ifndef _SELINUX_AV_PERMISSIONS_H_" > security/selinux/include/av_permissions.h
            echo "#define _SELINUX_AV_PERMISSIONS_H_" >> security/selinux/include/av_permissions.h
            echo "#endif" >> security/selinux/include/av_permissions.h
            cp security/selinux/include/av_permissions.h security/selinux/av_permissions.h
          fi
          # Patch compatibility macros for x86_64 legacy 4.19 kernels
          find drivers/kernelsu/ -name "*.c" -o -name "*.h" | xargs sed -i '1s/^/#ifndef untagged_addr\n#define untagged_addr(addr) (addr)\n#endif\n#ifndef __nocfi\n#define __nocfi\n#endif\n#ifndef phys_to_page\n#define phys_to_page(phys) pfn_to_page(__phys_to_pfn(phys))\n#endif\n/' || true
          # Export unexported SELinux symbols required by KernelSU built-in
          echo "#include <linux/export.h>" >> security/selinux/ss/hashtab.c
          echo "EXPORT_SYMBOL(hashtab_search);" >> security/selinux/ss/hashtab.c
          echo "EXPORT_SYMBOL(hashtab_insert);" >> security/selinux/ss/hashtab.c
          echo "#include <linux/export.h>" >> security/selinux/ss/ebitmap.c
          echo "EXPORT_SYMBOL(ebitmap_set_bit);" >> security/selinux/ss/ebitmap.c
          echo "#include <linux/export.h>" >> security/selinux/hooks.c
          echo "EXPORT_SYMBOL(selinux_state);" >> security/selinux/hooks.c || true
          echo "EXPORT_SYMBOL(selinux_kernel_status_page);" >> security/selinux/selinuxfs.c || true
          # Add ksu_input_hook bool definition if input hooking is disabled
          echo -e "\nbool ksu_input_hook = false;" >> drivers/kernelsu/core/ksu.c || true
          # Compile bzImage
          make ARCH=x86_64 -j$(nproc) bzImage 2>&1 | tee ../build.log
          echo "=== Build complete ==="
          ls -lh arch/x86/boot/bzImage
          # Show embedded kernel version
          file arch/x86/boot/bzImage

      # ── 8. Also build KSU module helpers (optional, if needed) ────────────
      - name: Build KSU module (if applicable)
        run: |
          cd kernel-src
          # Build kernel modules - needed for some KSU functionality
          make ARCH=x86_64 -j$(nproc) modules 2>&1 | tail -20 || true

      # ── 9. Package artifacts ──────────────────────────────────────────────
      - name: Package build artifacts
        run: |
          mkdir -p artifacts
          cp kernel-src/arch/x86/boot/bzImage artifacts/bzImage-4.19-ksu-next
          cp kernel-src/.config artifacts/kernel.config
          # Extract and save kernel version string
          strings artifacts/bzImage-4.19-ksu-next | grep "Linux version" | head -1 \
            > artifacts/kernel-version.txt
          cat artifacts/kernel-version.txt
          # Compress bzImage for download
          gzip -k artifacts/bzImage-4.19-ksu-next

      # ── 10. Upload artifacts ──────────────────────────────────────────────
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bluestacks-ksu-next-kernel-${{ env.KVER }}
          path: |
            artifacts/
            build.log
          retention-days: 7

      # ── 11. Print build summary ───────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## Kernel Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel Version | ${{ env.KVER }}-ksu-next |" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | x86_64 |" >> $GITHUB_STEP_SUMMARY
          echo "| KernelSU Next | Legacy driver (kprobe-based) |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | BlueStacks 5 Pie64 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat artifacts/kernel-version.txt >> $GITHUB_STEP_SUMMARY
